<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Manhattan street grid (thin, asymmetric, whitespace): 3 avenues + 2 streets -->
  <path d="M18 20v56" stroke-width="1" opacity="0.5"/>
  <path d="M34 20v56" stroke-width="1" opacity="0.5"/>
  <path d="M50 20v56" stroke-width="1" opacity="0.5"/>
  <path d="M12 38h44" stroke-width="1" opacity="0.5"/>
  <path d="M12 56h44" stroke-width="1" opacity="0.5"/>
  <!-- Broadway: the diagonal slicing the grid (readable) -->
  <path d="M10 100L52 58" stroke-width="1" opacity="0.7"/>
  <!-- East River: a real vertical band clear of the grid -->
  <path d="M90 12v96" stroke-width="1" opacity="0.4"/>
  <path d="M100 12v96" stroke-width="1" opacity="0.4"/>
  <!-- Brooklyn Bridge: road from the grid to two towers, deck, sagging cable -->
  <path d="M60 50h22" stroke-width="1" opacity="0.6"/>
  <path d="M88 36v24M98 36v24" />
  <path d="M82 60h20" />
  <path d="M88 38q5 11 10 0" />
</svg>