  <circle cx="20" cy="40" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="20" cy="48" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="20" cy="56" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="20" cy="64" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="20" cy="72" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="20" cy="80" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="20" cy="88" r="1.6" fill="currentColor" stroke="none"/>

  <!-- Mid-rise stepped tower -->
  <path d="M34 96V44h12v20h10v32"/>
  <circle cx="40" cy="50" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="40" cy="58" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="40" cy="66" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="40" cy="74" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="40" cy="82" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="40" cy="90" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="51" cy="74" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="51" cy="82" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="51" cy="90" r="1.6" fill="currentColor" stroke="none"/>

  <!-- Slender tower -->
  <path d="M62 96V34h10v62"/>
  <circle cx="67" cy="40" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="67" cy="48" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="67" cy="56" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="67" cy="64" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="67" cy="72" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="67" cy="80" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="67" cy="88" r="1.6" fill="currentColor" stroke="none"/>

  <!-- Wide low-rise with roof detail -->
  <path d="M80 96V58h24v38"/>
  <circle cx="86" cy="70" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="92" cy="70" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="98" cy="70" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="86" cy="82" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="92" cy="82" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="98" cy="82" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="86" cy="90" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="92" cy="90" r="1.6" fill="currentColor" stroke="none"/>
  <circle cx="98" cy="90" r="1.6" fill="currentColor" stroke="none"/>

  <!-- Ground line -->
  <path d="M8 96h104" stroke-width="1" opacity="0.35"/>
