  <path d="M32 49v6M32 83v-6M15 66h6M43 66h6M20.2 54.2l4.2 4.2M39.6 73.6l4.2 4.2M20.2 77.8l4.2-4.2M39.6 58.4l4.2-4.2" stroke-width="1.1" opacity="0.75"/>
